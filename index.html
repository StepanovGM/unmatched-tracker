<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Unmatched Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121317" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <h1>Unmatched Tracker</h1>

    <section class="card">
      <h2>Persistence test</h2>
      <p class="hint">This count is saved to localStorage. Reload the page — it should not reset.</p>
      <div class="counter-row">
        <button id="decrement" class="btn btn-secondary">-</button>
        <span id="counter-value" class="counter-value">0</span>
        <button id="increment" class="btn btn-secondary">+</button>
      </div>
    </section>

    <section class="card">
      <h2>Share test</h2>
      <p class="hint">On your phone this opens the native share sheet (Telegram included); on desktop it copies the JSON to your clipboard instead.</p>
      <button id="share-btn" class="btn btn-primary">Share state as JSON</button>
      <label class="btn btn-secondary file-label">
        Import JSON
        <input id="import-input" type="file" accept="application/json" hidden />
      </label>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
